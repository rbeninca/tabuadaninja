<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A Ilha Mágica das Palavras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="game-root">

    <!-- ==================== TELA INICIAL ==================== -->
    <div id="screen-home" class="screen">
      <div class="screen-bg" style="background-image: url('imgens/backgrounds/fase-1.png'); background-color: #87CEEB;"></div>
      <div class="screen-content" id="home-content">
        <!-- Renderizado por HomeScreen.js -->
      </div>
    </div>

    <!-- ==================== MAPA ==================== -->
    <div id="screen-map" class="screen">
      <div class="screen-bg" style="background-image: url('imgens/mapa-ilha/mapa-ilha.png'); background-color: #7EC8E3;"></div>
      <div class="screen-content" id="map-content">
        <!-- Renderizado por MapScreen.js -->
      </div>
    </div>

    <!-- ==================== FASE ==================== -->
    <div id="screen-level" class="screen">
      <div class="screen-bg" id="level-bg" style="background-color: #F0F8FF;"></div>
      <div id="level-content" style="position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;">
        <!-- Renderizado por LevelScreen.js -->
      </div>
    </div>

    <!-- ==================== RESULTADO ==================== -->
    <div id="screen-result" class="screen">
      <div class="screen-bg" style="background-color: #1a1a2e;"></div>
      <div class="screen-content" id="result-content">
        <!-- Renderizado por ResultScreen.js -->
      </div>
    </div>

    <!-- ==================== PROGRESSO ==================== -->
    <div id="screen-progress" class="screen">
      <div class="screen-bg" style="background-color: #0f3460;"></div>
      <div class="screen-content" id="progress-content" style="overflow-y:auto;max-height:100vh;padding-top:20px;padding-bottom:20px;">
        <!-- Renderizado por ProgressScreen.js -->
      </div>
    </div>

    <!-- ==================== FEEDBACK OVERLAY ==================== -->
    <div class="feedback-overlay" id="feedback-overlay" style="display:none;pointer-events:all;"></div>

  </div>

  <script type="module">
    import App from './js/core/App.js'
    window.addEventListener('DOMContentLoaded', () => App.init())
  </script>
</body>
</html>
