<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninja da Tabuada - Matrix Edition</title>
    <style>
        :root { --primary: #3498db; --success: #2ecc71; --danger: #e74c3c; --accent: #f1c40f; --matrix: #00ff41; }
        body { margin: 0; overflow: hidden; background: #020617; font-family: 'Segoe UI', Arial, sans-serif; touch-action: none; color: white; }
        canvas { display: block; }

        .overlay {
            position: absolute; inset: 0; background: rgba(2, 6, 23, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; padding: 20px; text-align: center;
        }
        .card {
            background: rgba(255,255,255,0.05); border: 2px solid var(--primary);
            padding: 30px; border-radius: 25px; width: 100%; max-width: 460px;
            box-shadow: 0 0 40px rgba(52, 152, 219, 0.2);
        }
        h1 { color: var(--accent); margin-top: 0; font-size: 2.8rem; text-shadow: 3px 3px 0px #000; }
        .field { margin-bottom: 18px; text-align: left; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #94a3b8; font-size: 12px; }
        input[type="text"], input[type="number"] {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #334155;
            background: #0f172a; color: white; font-size: 18px; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 18px; background: var(--success); color: white;
            border: none; border-radius: 12px; font-size: 22px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
        }

        #game-ui {
            position: absolute; top: 0; left: 0; width: 100%; pointer-events: none;
            display: flex; justify-content: space-between; align-items: center;
            padding: 22px 28px; box-sizing: border-box;
            font-size: 20px; font-weight: bold; z-index: 10;
        }
        #pergunta-container {
            position: absolute; top: 90px; width: 100%;
            text-align: center; pointer-events: none; z-index: 5;
        }
        #pergunta {
            font-size: clamp(34px, 7vw, 72px); font-weight: 900;
            background: rgba(15, 23, 42, 0.85);
            padding: clamp(8px, 1.5vw, 15px) clamp(18px, 4vw, 46px);
            border-radius: 60px; border: 3px solid var(--accent);
            display: inline-block; transition: 0.3s;
        }
        #pts-bonus {
            position: absolute; bottom: -36px; left: 50%; transform: translateX(-50%);
            font-size: clamp(12px, 2vw, 20px); color: var(--success); white-space: nowrap;
        }

        #matrix-btn {
            position: absolute; bottom: 24px; right: 24px; width: 72px; height: 72px;
            background: rgba(0, 255, 65, 0.2); border: 3px solid var(--matrix);
            border-radius: 50%; color: var(--matrix); font-size: 28px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 1000; user-select: none;
        }
        #matrix-btn:active { background: var(--matrix); color: black; }

        #menu-inicial { background: rgba(2, 6, 23, 0.78); }

        #pause-btn {
            width: auto; padding: 4px 12px; font-size: 15px; font-weight: bold;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            border-radius: 8px; color: white; cursor: pointer; pointer-events: auto;
            transition: background 0.2s; margin-left: 10px; vertical-align: middle;
        }
        #pause-btn:hover { background: rgba(255,255,255,0.25); }

        .hint-desktop { display: inline; }
        .hint-mobile  { display: none; }

        /* ── Tablet (≤ 768px) ── */
        @media (max-width: 768px) {
            #game-ui { padding: 14px 18px; font-size: 16px; }
            #pergunta-container { top: 72px; }
            .card { padding: 24px 20px; }
            h1 { font-size: 2.2rem; }
            #matrix-btn { width: 62px; height: 62px; font-size: 22px; bottom: 16px; right: 16px; }
            .hint-desktop { display: none; }
            .hint-mobile  { display: inline; }
        }
        /* ── Mobile (≤ 480px) ── */
        @media (max-width: 480px) {
            #game-ui { padding: 10px 12px; font-size: 13px; }
            #pergunta-container { top: 55px; }
            #pergunta { border-width: 2px; border-radius: 36px; }
            #pts-bonus { bottom: -26px; }
            .card { padding: 16px 14px; border-radius: 18px; }
            h1 { font-size: 1.75rem; }
            input[type="text"], input[type="number"] { padding: 11px; font-size: 16px; }
            button { padding: 13px; font-size: 18px; }
            .field { margin-bottom: 12px; }
            #pause-btn { font-size: 12px; padding: 3px 7px; margin-left: 6px; }

            .float-dano { font-size: 22px; }
        }
        /* ── Desktop largo (≥ 1200px) ── */
        @media (min-width: 1200px) {
            #game-ui { padding: 28px 40px; font-size: 22px; }
            #pergunta-container { top: 110px; }
            #matrix-btn { width: 80px; height: 80px; font-size: 30px; }
        }

        @keyframes pauseFloat {
            0%   { opacity: 0; transform: scale(0.6); }
            15%  { opacity: 1; transform: scale(1.05); }
            85%  { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.8); }
        }
        #pause-overlay {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            pointer-events: auto; z-index: 50;
            background: rgba(2, 6, 23, 0.55);
        }
        #pause-overlay .pause-titulo {
            font-size: clamp(3rem, 12vw, 7rem); font-weight: 900;
            color: white; letter-spacing: 10px; text-transform: uppercase;
            text-shadow: 0 0 40px rgba(52,152,219,0.8), 0 4px 8px rgba(0,0,0,0.8);
            margin-bottom: 0.5em; animation: pausePulse 2s ease-in-out infinite;
        }
        @keyframes pausePulse {
            0%, 100% { opacity: 1;   transform: scale(1); }
            50%       { opacity: 0.75; transform: scale(0.97); }
        }
        #pause-overlay .pause-sub {
            font-size: clamp(1rem, 3vw, 1.4rem); color: rgba(255,255,255,0.5);
            letter-spacing: 3px; margin-bottom: 2em; text-transform: uppercase;
        }
        #btn-continuar {
            width: auto; min-width: 220px; padding: 16px 40px;
            font-size: clamp(16px, 3vw, 22px); font-weight: 900;
            background: var(--primary); color: white;
            border: none; border-radius: 50px;
            cursor: pointer; letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(52,152,219,0.6);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        #btn-continuar:hover, #btn-continuar:active {
            transform: scale(1.07);
            box-shadow: 0 0 50px rgba(52,152,219,0.9);
        }
        #btn-menu {
            width: auto; min-width: 220px; padding: 12px 36px; margin-top: 14px;
            font-size: clamp(14px, 2.5vw, 18px); font-weight: 700;
            background: transparent; color: rgba(255,255,255,0.6);
            border: 2px solid rgba(255,255,255,0.25); border-radius: 50px;
            cursor: pointer; letter-spacing: 2px; transition: all 0.2s;
        }
        #btn-menu:hover, #btn-menu:active {
            background: rgba(231,76,60,0.25); color: #e74c3c;
            border-color: #e74c3c; box-shadow: 0 0 20px rgba(231,76,60,0.4);
        }
        @keyframes fadeIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
        @keyframes milestoneIn {
            0%   { opacity:0; transform: scale(0.4) translateY(40px); }
            18%  { opacity:1; transform: scale(1.12) translateY(0); }
            30%  { transform: scale(1); }
            70%  { opacity:1; transform: scale(1); }
            100% { opacity:0; transform: scale(1.1) translateY(-20px); }
        }
        @keyframes milestoneShake {
            0%,100%{ transform: rotate(0deg); }
            20%    { transform: rotate(-4deg); }
            40%    { transform: rotate(4deg); }
            60%    { transform: rotate(-3deg); }
            80%    { transform: rotate(3deg); }
        }
        #milestone-overlay {
            position: absolute; inset: 0; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none; z-index: 60;
        }
        .milestone-texto {
            font-size: clamp(3.5rem, 14vw, 8rem); font-weight: 900;
            color: #f1c40f; letter-spacing: 4px;
            text-shadow: 0 0 30px #f1c40f, 0 0 60px rgba(241,196,15,0.6), 0 4px 8px rgba(0,0,0,0.8);
            animation: milestoneIn 2.8s forwards, milestoneShake 0.4s 0.18s 2;
        }
        .milestone-sub {
            font-size: clamp(1rem, 3.5vw, 1.6rem); color: rgba(255,255,255,0.9);
            letter-spacing: 3px; margin-top: 0.4em; text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }
        .milestone-streak {
            font-size: clamp(0.8rem, 2.5vw, 1.1rem); color: rgba(255,255,255,0.55);
            letter-spacing: 2px; margin-top: 0.3em;
        }
        #confirm-menu {
            margin-top: 20px; background: rgba(0,0,0,0.7); border-radius: 16px;
            padding: 20px 30px; border: 1px solid rgba(231,76,60,0.5);
            animation: fadeIn 0.2s ease;
        }
        .confirm-texto {
            color: rgba(255,255,255,0.85); font-size: clamp(13px, 2.5vw, 16px);
            text-align: center; margin-bottom: 16px; line-height: 1.5;
        }
        .confirm-texto strong { color: #f1c40f; }
        .confirm-btns { display: flex; gap: 14px; justify-content: center; }
        .btn-sim {
            padding: 10px 28px; background: #e74c3c; color: white;
            border: none; border-radius: 30px; font-size: clamp(13px, 2.5vw, 16px);
            font-weight: 700; cursor: pointer; transition: transform 0.15s;
        }
        .btn-sim:hover { transform: scale(1.07); }
        .btn-nao {
            padding: 10px 28px; background: transparent; color: rgba(255,255,255,0.7);
            border: 2px solid rgba(255,255,255,0.3); border-radius: 30px;
            font-size: clamp(13px, 2.5vw, 16px); font-weight: 700; cursor: pointer;
            transition: all 0.15s;
        }
        .btn-nao:hover { border-color: white; color: white; }
        @media (max-width: 480px) {
            #pause-overlay .pause-titulo { letter-spacing: 5px; }
            #btn-continuar { min-width: 170px; padding: 14px 28px; }
            #btn-menu { min-width: 170px; }
        }

        /* Segmented progress bar */
        #barra-acertos {
            display: inline-flex; gap: 4px; align-items: center;
            margin-left: 8px; vertical-align: middle;
        }
        .barra-seg {
            width: 16px; height: 9px; border-radius: 3px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            transition: background 0.2s, box-shadow 0.2s, border-color 0.2s;
        }
        @media (max-width: 480px) {
            .barra-seg { width: 12px; height: 7px; }
            #barra-acertos { gap: 3px; }
        }
        /* Pill toggle for config */
        .toggle-group {
            display: flex; border-radius: 12px; overflow: hidden;
            border: 1px solid #334155;
        }
        .toggle-opt {
            flex: 1; padding: 10px 8px; background: transparent;
            color: rgba(255,255,255,0.45); border: none; cursor: pointer;
            font-size: 15px; font-family: inherit; font-weight: 600;
            transition: all 0.18s;
        }
        .toggle-opt.active {
            background: var(--primary); color: white;
        }
        .toggle-opt:not(.active):hover { background: rgba(255,255,255,0.06); }

        @keyframes vidaDano {
            0%   { transform: scale(1);    color: inherit; }
            15%  { transform: scale(1.8) rotate(-15deg); color: #ff0000; text-shadow: 0 0 20px #ff0000; }
            35%  { transform: scale(0.7)  rotate(12deg);  color: #ff4444; }
            55%  { transform: scale(1.4)  rotate(-8deg);  color: #ff2222; }
            75%  { transform: scale(0.9); color: #ff6666; }
            100% { transform: scale(1);   color: inherit; }
        }
        .vida-dano { animation: vidaDano 0.55s ease; }

        @keyframes floatDano {
            0%   { opacity: 1; transform: translateY(0)   scale(1.2); }
            100% { opacity: 0; transform: translateY(80px) scale(0.7); }
        }
        .float-dano {
            position: fixed; pointer-events: none; z-index: 999;
            font-size: 32px; font-weight: bold; color: #e74c3c;
            text-shadow: 0 0 12px #ff0000;
            animation: floatDano 1s ease-out forwards;
        }
    </style>
</head>
<body>

    <div id="menu-inicial" class="overlay">
        <div class="card">
            <h1>TABUADA NINJA</h1>
            <div class="field">
                <label>Nome do Aluno:</label>
                <input type="text" id="nome-input" value="Ninja">
            </div>
            <div class="field">
                <label>Vidas:</label>
                <input type="number" id="vidas-input" value="10" min="1" max="30">
            </div>
            <div class="field">
                <label>Velocidade (1-10):</label>
                <input type="range" id="vel-slider" min="1" max="10" value="2" style="width:100%">
            </div>
            <div class="field">
                <label>Acertos para ganhar vida:</label>
                <div class="toggle-group" id="meta-toggle">
                    <button class="toggle-opt active" data-val="5" onclick="selectMeta(this)">🎁 5 acertos</button>
                    <button class="toggle-opt" data-val="10" onclick="selectMeta(this)">🎁 10 acertos</button>
                </div>
            </div>
            <div class="field">
                <label>Modo de Jogo:</label>
                <select id="modo-select" style="width:100%;padding:12px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;font-size:16px;">
                    <option value="misto">🔀 Misto (conta e resultado)</option>
                    <option value="nunca">🔢 Conta → Resultado (ex: 3×4 = ?)</option>
                    <option value="sempre">🔄 Resultado → Conta (ex: ? = 12)</option>
                </select>
            </div>
            <p style="font-size: 14px; color: #888;">
                Dica: <span class="hint-desktop">Segure <b>ESPAÇO</b></span><span class="hint-mobile">Segure o botão <b>⌛</b></span> para Câmera Lenta!
            </p>
            <button onclick="startGame()">Começar</button>
            <button onclick="pedirTelaCheia()" style="
                margin-top: 10px; background: rgba(255,255,255,0.08);
                border: 1px solid rgba(255,255,255,0.25); font-size: 15px;
                padding: 10px; color: rgba(255,255,255,0.7); border-radius: 10px;">
                🔲 Tela cheia
            </button>
            <div style="margin-top:18px;border-top:1px solid #1e293b;padding-top:14px;">
                <div style="color:var(--accent);font-size:13px;font-weight:700;letter-spacing:2px;margin-bottom:10px;">🏆 TOP 10</div>
                <div id="menu-ranking-loading" style="font-size:13px;color:rgba(255,255,255,0.3);text-align:center;padding:8px 0;">carregando...</div>
                <table id="menu-ranking-table" style="width:100%;border-collapse:collapse;font-size:13px;display:none;">
                    <tbody id="menu-ranking-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="game-ui" style="display: none;">
        <div>👤 <span id="display-nome"></span><button id="pause-btn" onclick="togglePause()">⏸</button></div>
        <div style="color: var(--danger);">❤️ <span id="display-vidas"></span><div id="barra-acertos"><div class="barra-seg" id="barra-seg-0"></div><div class="barra-seg" id="barra-seg-1"></div><div class="barra-seg" id="barra-seg-2"></div><div class="barra-seg" id="barra-seg-3"></div><div class="barra-seg" id="barra-seg-4"></div></div></div>
        <div style="color: var(--accent);">⭐ <span id="display-pontos">0</span></div>
    </div>
    <div id="pause-overlay" style="display:none;">
        <div class="pause-titulo">⏸ PAUSADO</div>
        <div class="pause-sub">jogo em pausa</div>
        <button id="btn-continuar" onclick="togglePause()">▶ Continuar</button>
        <button id="btn-menu" onclick="voltarMenu()">🏠 Menu Principal</button>
        <div id="confirm-menu" style="display:none;">
            <div class="confirm-texto">Tem certeza? Você perderá<br><strong id="confirm-pts"></strong> pontos acumulados.</div>
            <div class="confirm-btns">
                <button class="btn-sim" onclick="confirmarMenu()">Sim, sair</button>
                <button class="btn-nao" onclick="cancelarMenu()">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="milestone-overlay">
        <div class="milestone-texto" id="milestone-texto"></div>
        <div class="milestone-sub" id="milestone-sub"></div>
        <div class="milestone-streak" id="milestone-streak"></div>
    </div>

    <div id="pergunta-container" style="display: none;">
        <div id="pergunta">
            <span id="conta"></span><span id="resultado-slot" style="color: var(--accent);">?</span><span id="conta-pos"></span>
            <div id="pts-bonus">Vale: 10 pts</div>
        </div>
    </div>

    <div id="matrix-btn" style="display: none;">⌛</div>

    <div id="game-over" class="overlay" style="display: none;">
        <div class="card" style="max-width:500px;width:92%;max-height:90vh;overflow-y:auto;">
            <h1 style="color:var(--danger);margin-bottom:8px;">FIM DE JOGO</h1>
            <p id="resumo-final" style="font-size:20px;margin-bottom:4px;"></p>
            <div id="resultado-final" style="font-size:16px;color:var(--accent);margin-bottom:6px;"></div>
            <div id="submit-status" style="font-size:13px;color:rgba(255,255,255,0.45);margin-bottom:14px;min-height:18px;"></div>
            <div id="ranking-section" style="display:none;margin-bottom:18px;">
                <h3 style="color:var(--accent);margin-bottom:8px;font-size:16px;">🏆 Top 10</h3>
                <table style="width:100%;border-collapse:collapse;font-size:13px;">
                    <thead>
                        <tr style="color:rgba(255,255,255,0.4);border-bottom:1px solid #334155;">
                            <th style="padding:4px 6px;text-align:left;font-weight:600;">#</th>
                            <th style="padding:4px 6px;text-align:left;font-weight:600;">Nome</th>
                            <th style="padding:4px 6px;text-align:right;font-weight:600;">Pts</th>
                            <th style="padding:4px 6px;text-align:right;font-weight:600;">Tempo</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-body"></tbody>
                </table>
            </div>
            <button onclick="location.reload()">RECOMEÇAR</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const WORKER_URL = 'https://tabuada-ninja-api.rbeninca.workers.dev';

    let config = { nome: "", vidas: 10, velBase: 2, modoInvertido: 'misto', metaAcertos: 5 };
    let tempoInicio = 0;
    let score = 0;
    let gameActive = false;
    let isBulletTime = false;
    let questionValue = 10;
    let acertosSeguidos = 0;
    let milestoneCount = 0;
    let usouDesaceleracao = false;
    let relancamentos = 0;
    let confetti = [];
    const coresMilestone = [
        '#2ecc71','#a8e063','#f1c40f','#e67e22',
        '#e74c3c','#c0392b','#9b59b6','#8e44ad',
        '#3498db','#00e5ff','#ffffff'
    ];
    
    let isPaused = false;
    let isStartScreen = true;
    let pauseItems = [];

    let frutas = [];
    let fragmentos = [];
    let explosoes = [];
    let efeitos = [];
    let rastro = [];
    let flyingNumber = null;
    let audioCtx = null;

    function pedirTelaCheia() {
        const el = document.documentElement;
        const fn = el.requestFullscreen
                || el.webkitRequestFullscreen
                || el.mozRequestFullScreen
                || el.msRequestFullscreen;
        if (fn) fn.call(el).catch(() => {});
    }

    function getAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
    }

    function playSliceSound() {
        const ac = getAudio();
        const now = ac.currentTime;

        // Swish: ruído varrendo de baixo para cima (lâmina cortando o ar)
        const bufLen = Math.floor(ac.sampleRate * 0.13);
        const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < bufLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufLen, 0.4);
        const swish = ac.createBufferSource();
        swish.buffer = buf;
        const bpf = ac.createBiquadFilter();
        bpf.type = 'bandpass'; bpf.Q.value = 1.5;
        bpf.frequency.setValueAtTime(600, now);
        bpf.frequency.exponentialRampToValueAtTime(6000, now + 0.08);
        const sg = ac.createGain();
        sg.gain.setValueAtTime(1.0, now);
        sg.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
        swish.connect(bpf); bpf.connect(sg); sg.connect(ac.destination);
        swish.start(now);

        // Ring metálico: frequências inarmônicas que decaem rápido (som de metal vibrando)
        [[1800, 0.45, 0.20], [2750, 0.30, 0.15], [4300, 0.18, 0.10]].forEach(([freq, amp, dur]) => {
            const osc = ac.createOscillator();
            const g = ac.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            g.gain.setValueAtTime(amp, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + dur);
            osc.connect(g); g.connect(ac.destination);
            osc.start(now); osc.stop(now + dur + 0.01);
        });
    }

    function playSuccessSound() {
        const ac = getAudio();
        const now = ac.currentTime;
        // Notas ascendentes: C5 E5 G5 C6
        [523, 659, 784, 1047].forEach((freq, i) => {
            const osc = ac.createOscillator();
            const g = ac.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            const t = now + i * 0.09;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.28, t + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
            osc.connect(g); g.connect(ac.destination);
            osc.start(t); osc.stop(t + 0.25);
        });
    }

    function playErrorSound() {
        const ac = getAudio();
        const now = ac.currentTime;
        // Duas notas descendentes em sawtooth — som de punição
        [360, 240].forEach((freq, i) => {
            const osc = ac.createOscillator();
            const g = ac.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + i * 0.16);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.65, now + i * 0.16 + 0.18);
            g.gain.setValueAtTime(0.35, now + i * 0.16);
            g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.16 + 0.2);
            osc.connect(g); g.connect(ac.destination);
            osc.start(now + i * 0.16);
            osc.stop(now + i * 0.16 + 0.22);
        });
    }

    function initPauseItems() {

            '#3498db','#9b59b6','#e91e63','#00bcd4','#8bc34a',
            '#ff5722','#607d8b','#ff9800','#673ab7','#009688',
            '#cddc39','#795548','#f06292'
        ];
        //Controle número de particulas no pause. 
        const pares = Math.max(5, Math.min(28, Math.round(canvas.width * canvas.height / 7000)));
        for (let i = 0; i < pares; i++) {
            const n1 = Math.floor(Math.random() * 8) + 2;
            const n2 = Math.floor(Math.random() * 8) + 2;
            const res = n1 * n2;
            const cor = coresPares[i % coresPares.length];
            const speed = () => (Math.random() - 0.5) * 3.2;
            pauseItems.push({
                text: `${n1}×${n2}`, res, isQ: true, cor, slow: 1,
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                vx: speed(), vy: speed(), r: 36, glow: 0, pulse: Math.random() * Math.PI * 2
            });
            pauseItems.push({
                text: `${res}`, res, isQ: false, cor, slow: 1,
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                vx: speed(), vy: speed(), r: 30, glow: 0, pulse: Math.random() * Math.PI * 2
            });
        }
    }

    function drawPauseScreen() {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Atualiza posições com slowdown suavizado
        pauseItems.forEach(item => {
            item.x += item.vx * item.slow; item.y += item.vy * item.slow;
            item.pulse += 0.04;
            if (item.x < item.r || item.x > canvas.width  - item.r) item.vx *= -1;
            if (item.y < item.r || item.y > canvas.height - item.r) item.vy *= -1;
            item.glow = Math.max(0, item.glow - 0.04);
        });

        // Conta arestas reais (linhas entre pares correspondentes) por bolha
        const limiar = 200;
        const arestas = pauseItems.map(() => 0);

        for (let i = 0; i < pauseItems.length; i++) {
            for (let j = i + 1; j < pauseItems.length; j++) {
                const a = pauseItems[i], b = pauseItems[j];
                if (a.res !== b.res || a.isQ === b.isQ) continue;
                const d = Math.hypot(a.x - b.x, a.y - b.y);
                if (d >= limiar) continue;
                const força = 1 - d / limiar;
                arestas[i]++;
                arestas[j]++;
                a.glow = Math.min(1, a.glow + força * 0.12);
                b.glow = Math.min(1, b.glow + força * 0.12);
                // Linha na cor do par
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = a.cor + Math.round(força * 0xb0).toString(16).padStart(2, '0');
                ctx.lineWidth = 2 + força * 4;
                ctx.shadowColor = a.cor; ctx.shadowBlur = 18 * força;
                ctx.stroke();
                ctx.restore();
            }
        }

        // Propaga cluster: marca bolhas conectadas a um nó com 2+ arestas
        const emCluster = pauseItems.map((_, i) => arestas[i] >= 2);
        for (let i = 0; i < pauseItems.length; i++) {
            if (!emCluster[i]) continue;
            for (let j = 0; j < pauseItems.length; j++) {
                if (i === j || emCluster[j]) continue;
                const a = pauseItems[i], b = pauseItems[j];
                if (a.res !== b.res || a.isQ === b.isQ) continue;
                if (Math.hypot(a.x - b.x, a.y - b.y) < limiar) emCluster[j] = true;
            }
        }

        // Aplica cor e desaceleração suave a bolhas em cluster
        pauseItems.forEach((item, i) => {
            const alvo = emCluster[i] ? 0.28 : 1;
            item.slow += (alvo - item.slow) * 0.06;
            item.activeColor = emCluster[i] ? '#ffffff' : item.cor;
            if (emCluster[i]) item.glow = Math.min(1, item.glow + 0.09);
        });

        // Desenha bolhas
        pauseItems.forEach(item => {
            const pulse = 1 + Math.sin(item.pulse) * 0.06;
            const r = item.r * pulse;
            const cor = item.activeColor || item.cor;
            ctx.save();
            if (item.glow > 0) {
                ctx.shadowColor = cor;
                ctx.shadowBlur = 35 * item.glow;
            }
            ctx.beginPath();
            ctx.arc(item.x, item.y, r, 0, Math.PI * 2);
            ctx.fillStyle = item.glow > 0.2
                ? cor + Math.round((0.12 + item.glow * 0.3) * 0xff).toString(16).padStart(2, '0')
                : 'rgba(255,255,255,0.07)';
            ctx.fill();
            ctx.strokeStyle = cor;
            ctx.lineWidth = item.glow > 0.2 ? 2 + item.glow * 4 : 1.5;
            ctx.globalAlpha = item.glow > 0.2 ? 1 : 0.45;
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = `bold ${item.isQ ? 20 : 26}px Arial`;
            ctx.fillStyle = item.glow > 0.2 ? cor : 'rgba(255,255,255,0.75)';
            ctx.fillText(item.text, item.x, item.y);
            ctx.restore();
        });
    }

        try {

                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome: config.nome, pontuacao: score, tempoJogo }),
            });
            if (!resp.ok) {
                const err = await resp.json().catch(() => ({}));
                statusEl.textContent = `⚠ Erro ${resp.status}: ${err.error ?? 'desconhecido'}`;

    }

    class Fruta {
        constructor(valor, isCorrect, slotIndex, totalSlots) {
            this.valor = valor;
            this.isCorrect = isCorrect;
            this.radius = 50;
            this.sliced = false;
            this.emoji = ["🍎", "🍉", "🍍", "🍊", "🍓", "🥝", "🍋"][Math.floor(Math.random()*7)];
            this.trail = [];

            const fatorVel = Math.pow(config.velBase, 1.5) * 0.025;
            this.gravity = 0.004 + (fatorVel * 0.1);

            const slotWidth = canvas.width / totalSlots;
            this.x = (slotWidth * slotIndex) + (slotWidth / 2);
            this.y = canvas.height + 100;

            const alturaAlvo = canvas.height * 0.88;
            this.vy = -Math.sqrt(2 * this.gravity * alturaAlvo);
            this.vx = (Math.random() - 0.5) * 1.5;
        }

        update() {
            const timeScale = isBulletTime ? 0.15 : 1;

            this.trail.push({ x: this.x, y: this.y });
            const maxTrail = isBulletTime ? 28 : 5;
            if (this.trail.length > maxTrail) this.trail.shift();

            this.x += this.vx * timeScale;
            this.y += this.vy * timeScale;
            this.vy += this.gravity * timeScale;

            if(this.x < 50 || this.x > canvas.width - 50) this.vx *= -1;
        }

        draw() {
            if(this.sliced) return;

            const sc = Math.min(1, Math.max(0.55, canvas.width / 900));
            const emojiSz = Math.round(75 * sc);
            const isExpr  = String(this.valor).includes('×');
            const numSz   = Math.round((isExpr ? 24 : 34) * sc);

            // Rastro da fruta
            const len = this.trail.length;
            for (let i = 1; i < len; i++) {
                const t = i / len;
                const alpha = t * (isBulletTime ? 0.7 : 0.35);
                const size = t * (isBulletTime ? emojiSz * 0.73 : emojiSz * 0.4);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.font = `${size}px Arial`;
                ctx.fillText(this.emoji, this.trail[i].x, this.trail[i].y);
                ctx.restore();
            }

            ctx.save();
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.font = `${emojiSz}px Arial`;
            ctx.fillText(this.emoji, this.x, this.y);

            ctx.font = `bold ${numSz}px Arial`;
            ctx.fillStyle = "white";
            ctx.strokeStyle = "black";
            ctx.lineWidth = Math.max(3, 5 * sc);
            ctx.strokeText(this.valor, this.x, this.y + 5 * sc);
            ctx.fillText(this.valor, this.x, this.y + 5 * sc);
            ctx.restore();
        }
    }

    function spawnFrutas() {
        frutas = [];
        const numTotal = 5;

        if (atualPergunta.invertido) {
            // Frutas mostram contas; corretas são qualquer a×b = res
            const target = atualPergunta.res;
            const opcoes = [{ txt: `${atualPergunta.n1}×${atualPergunta.n2}`, res: target }];
            let tentativas = 0;
            while (opcoes.length < numTotal && tentativas < 200) {
                tentativas++;
                const a = Math.floor(Math.random() * 8) + 2;
                const b = Math.floor(Math.random() * 8) + 2;
                const txt = `${a}×${b}`;
                if (!opcoes.find(o => o.txt === txt)) opcoes.push({ txt, res: a * b });
            }
            opcoes.sort(() => Math.random() - 0.5);
            opcoes.forEach((op, i) => frutas.push(new Fruta(op.txt, op.res === target, i, numTotal)));
        } else {
            let respostas = [atualPergunta.res];
            while (respostas.length < numTotal) {
                let erro = atualPergunta.res + (Math.floor(Math.random() * 15) - 7);
                if (!respostas.includes(erro) && erro > 0) respostas.push(erro);
            }
            respostas.sort(() => Math.random() - 0.5);
            respostas.forEach((v, i) => frutas.push(new Fruta(v, v === atualPergunta.res, i, numTotal)));
        }
    }

    function animate() {
        if(!gameActive) return;

        if (isPaused) {
            drawPauseScreen();
            requestAnimationFrame(animate);
            return;
        }

        ctx.fillStyle = "#020617";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if(isBulletTime) {
            document.getElementById('pts-bonus').innerText = `Vale: 5 pts (desacelerar)`;
            document.getElementById('pts-bonus').style.color = "var(--danger)";
        } else if (usouDesaceleracao) {
            document.getElementById('pts-bonus').innerText = `Vale: 5 pts`;
            document.getElementById('pts-bonus').style.color = "var(--danger)";
        }

        // Rastro
        if(rastro.length > 1) {
            ctx.beginPath();
            ctx.strokeStyle = isBulletTime ? "#00ff41" : "#38bdf8";
            ctx.lineWidth = 10;
            ctx.moveTo(rastro[0].x, rastro[0].y);
            rastro.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.stroke();
        }

        for(let i = frutas.length - 1; i >= 0; i--) {
            let f = frutas[i];
            f.update();
            f.draw();

            rastro.forEach(p => {
                let d = Math.hypot(p.x - f.x, p.y - f.y);
                if(d < 55 && !f.sliced) {
                    f.sliced = true;
                    if(f.isCorrect) {
                        const baseMax = usouDesaceleracao ? 5 : 10;
                        const pts = relancamentos === 0 ? baseMax
                                  : relancamentos === 1 ? Math.max(baseMax - 3, 0)
                                  : 0;
                        score += pts;
                        document.getElementById('display-pontos').innerText = score;
                        if (relancamentos < 2) {
                            acertosSeguidos++;
                            if (acertosSeguidos % config.metaAcertos === 0) {
                                updateBarraAcertos(true);
                                milestoneCount++;
                                const ganho = Math.pow(2, milestoneCount - 1);
                                config.vidas += ganho;
                                document.getElementById('display-vidas').innerText = config.vidas;
                                setTimeout(() => updateBarraAcertos(), 550);
                                spawnConfetti(ganho, f.x, f.y);
                                mostrarMilestone(ganho);
                                playMilestoneSound();
                            } else {
                                updateBarraAcertos();
                            }
                        }
                        spawnFragmentos(f.x, f.y, f.emoji);
                        playSuccessSound();
                        const slot = document.getElementById('resultado-slot');
                        const r = slot.getBoundingClientRect();
                        flyingNumber = { x: f.x, y: f.y, val: f.valor, progress: 0, targetX: r.left + r.width / 2, targetY: r.top + r.height / 2 };
                    } else {
                        playErrorSound();
                        spawnExplosao(f.x, f.y);
                        acertosSeguidos = 0;
                        milestoneCount = 0;
                        updateBarraAcertos();
                        config.vidas--;
                        document.getElementById('display-vidas').innerText = config.vidas;
                        animarDanoVida();
                        if(config.vidas <= 0) {
                            gameActive = false;
                            document.getElementById('game-over').style.display = 'flex';
                            document.getElementById('resumo-final').innerText = `Fim do treino, ${config.nome}!`;
                            submitScore();
                        }
                    }
                }
            });

            if(f.y > canvas.height + 300) {
                frutas.splice(i, 1);
                if(frutas.length === 0 && !flyingNumber) {
                    relancamentos++;
                    const ptsBon = document.getElementById('pts-bonus');
                    if (relancamentos >= 2) {
                        ptsBon.innerText = 'Vale: 0 pts';
                        ptsBon.style.color = 'var(--danger)';
                    } else {
                        const baseRel = usouDesaceleracao ? 2 : 7;
                        ptsBon.innerText = `Vale: ${baseRel} pts (${relancamentos}º relançamento)`;
                        ptsBon.style.color = 'var(--danger)';
                    }
                    spawnFrutas();
                }
            }
        }

        // Explosão
        for (let i = explosoes.length - 1; i >= 0; i--) {
            const p = explosoes[i];
            p.x += p.vx; p.y += p.vy; p.vy += 0.45;
            p.alpha -= 0.024; p.r *= 0.97;
            if (p.alpha <= 0) { explosoes.splice(i, 1); continue; }
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color; ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // Fragmentos
        for (let i = fragmentos.length - 1; i >= 0; i--) {
            const f = fragmentos[i];
            f.x += f.vx; f.y += f.vy; f.vy += 0.4;
            f.rot += f.rotSpeed;
            f.alpha -= 0.022;
            if (f.alpha <= 0) { fragmentos.splice(i, 1); continue; }
            ctx.save();
            ctx.globalAlpha = f.alpha;
            ctx.translate(f.x, f.y);
            ctx.rotate(f.rot);
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = `${Math.round(75 * f.scale)}px Arial`;
            ctx.fillText(f.emoji, 0, 0);
            ctx.restore();
        }

        // Confetti / Purpurina
        for (let i = confetti.length - 1; i >= 0; i--) {
            const p = confetti[i];
            p.x += p.vx; p.y += p.vy;
            p.vy += 0.28; p.vx *= 0.995;
            p.rot += p.rotSpeed;
            p.alpha -= 0.011;
            if (p.alpha <= 0) { confetti.splice(i, 1); continue; }
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            if (p.glow) { ctx.shadowColor = p.color; ctx.shadowBlur = 14; }
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            if (p.circle) {
                ctx.beginPath();
                ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillRect(-p.size * 0.5, -p.size * 0.3, p.size, p.size * 0.6);
            }
            ctx.restore();
        }

        // Flying Number
        if(flyingNumber) {
            flyingNumber.progress = Math.min(1, flyingNumber.progress + 0.045);
            const ease = 1 - Math.pow(1 - flyingNumber.progress, 3);
            const curX = flyingNumber.x + (flyingNumber.targetX - flyingNumber.x) * ease;
            const curY = flyingNumber.y + (flyingNumber.targetY - flyingNumber.y) * ease;
            const fontSize = Math.round(70 - 30 * ease);
            ctx.save();
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.shadowColor = "#f1c40f";
            ctx.shadowBlur = 24 * (1 - ease);
            ctx.fillStyle = "#f1c40f";
            ctx.fillText(flyingNumber.val, curX, curY);
            ctx.restore();
            if(flyingNumber.progress >= 1) {
                document.getElementById('resultado-slot').innerText = flyingNumber.val;
                document.getElementById('resultado-slot').style.color = "var(--success)";
                flyingNumber = null;
                setTimeout(novaPergunta, 800);
            }
        }

        if(rastro.length > 12) rastro.shift();
        requestAnimationFrame(animate);
    }

    // Input Listeners
    window.addEventListener('keydown', e => {
        if(e.code === 'Space') { isBulletTime = true; usouDesaceleracao = true; }
        if(e.code === 'KeyP') togglePause();
    });
    window.addEventListener('keyup', e => { if(e.code === 'Space') isBulletTime = false; });

    // Mobile Matrix Button
    const matrixBtn = document.getElementById('matrix-btn');
    matrixBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isBulletTime = true; usouDesaceleracao = true; });
    matrixBtn.addEventListener('touchend', () => { isBulletTime = false; });

    const handleMove = (x, y) => { if(gameActive) rastro.push({x, y}); };
    canvas.addEventListener('mousedown', () => { if(gameActive) playSliceSound(); });
    canvas.addEventListener('touchstart', e => { if(gameActive && e.target === canvas) playSliceSound(); }, {passive: true});
    canvas.addEventListener('mousemove', e => { if(e.buttons === 1) handleMove(e.clientX, e.clientY); });
    canvas.addEventListener('touchmove', e => {
        e.preventDefault(); handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive: false});
    window.addEventListener('mouseup', () => rastro = []);
    window.addEventListener('touchend', () => rastro = []);

    carregarRankingMenu();

</script>
</body>
</html>
